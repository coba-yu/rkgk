[project]
name = "rkgk"
version = "0.1.0"
description = "Research Knowledge Graph Kit"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
extract = "rkgk.cli.extract:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rkgk"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 119
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires external models",
]
addopts = "-m 'not slow'"
